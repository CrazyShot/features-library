<!-- ===== FEATURE: WAVE-DIRECTOR START (id: WAVE-DIRECTOR-1.0.0) =====
 Survival attack schedule: warning -> countdown -> wave (scheduled spawns) -> completion detection -> recovery -> next preparation -> ... -> final wave -> signal.
 THERE IS STILL ONLY ONE WAVE CONTROLLER: this module REPLACES the scheduling part of the host's waveTick(dt) (it wraps it) - it does not run beside it.
 It owns no enemy AI, no combat and no clock. Everything it does is driven by the sim dt the host already passes to waveTick, so
 pause (G.speed 0), game speed (1/2/3x) and G.state!=='play' freeze / scale it automatically.
 REUSED host systems:  planWave() (spawn-point choice + 'warn' event/marker), startNight() (wave++ , spawn-point validation, horn + toast, phase 'night'),
   spawnE(p) (the ONLY place enemies are created - stats, AI fields, G.wE counting), endGame(true|false) (victory/defeat screen), pickSpawns(), dirName(), ev(), toast via ev('toast'),
   killQuiet() (cancel), callNight() / N key / "Call wave" button (still work), the host HUD line #wv and the spawn-point markers (G.pts / G.warned / G.sq / G.phase are kept mirrored).
 WHAT IT ADDS: preparation timer per wave, warning lead, countdown events, recovery breather after a cleared wave, wave size + composition tables
   (grunt / swift / brute = the SAME host enemy with hp / dmg / speed multipliers through its existing fields mh, hp, dmg, sm), tracking of the exact enemies it spawned,
   completion detection from those enemies (deaths, quiet removals, age-out), hold/resume, cancel/restart, configurable finalWave (Infinity = endless) and the final-wave signal.
 DEFAULTS reproduce the host's curve for waves 1-5: counts 5,8,11,14,18 (+4 per wave after), preparation 55 s then 45 s, warning 22 s before, spawn lead 2 s, 0.8 s spacing.
 SIGNALS: FEATURE_WAVE_DIRECTOR.on('finalWaveDefeated', fn)  |  window event 'bastion:final-wave-defeated'  |  FEATURE_WAVE_DIRECTOR.status().finalDefeated  (then host endGame(true) unless cfg.onFinalDefeated==='signal').
 Touches: wraps waveTick, uiUpdate. No host edits. DOM ids: wavedir-banner, wavedir-css.
 API: window.FEATURE_WAVE_DIRECTOR { cfg, on(evt,fn)->off, status(), callWave(), pause(), resume(), cancel(opts), start(opts), jumpTo(n), enable(), disable(), countFor(w), composition(w), version }
 EVENTS (detail also dispatched as window 'wavedirector' CustomEvent {type,...}): prepStart warning countdown waveStart finalWaveStart spawn enemyDown waveCleared recoveryStart recoveryEnd
   finalWaveDefeated held released cancelled started blocked lost pause resume
-->
<style id="wavedir-css">
#wavedir-banner{position:fixed;left:50%;top:180px;transform:translateX(-50%);z-index:6;pointer-events:none;display:none;text-align:center;font:13px Georgia,serif;color:#f3e3c0;
 padding:6px 16px;border:1px solid var(--edge,#7a5a34);border-radius:8px;background:rgba(40,24,18,.82);backdrop-filter:blur(3px);min-width:190px}
#wavedir-banner b{display:block;letter-spacing:.08em;font-size:15px;color:#ffd27a}
#wavedir-banner small{display:block;opacity:.85;font-size:11.5px;margin-top:2px}
#wavedir-banner.warn b{color:#ff9a7a;animation:wdpulse .8s ease-in-out infinite alternate}
#wavedir-banner.final b{color:#ff6a5a}
#wavedir-banner i{display:block;height:4px;margin-top:5px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden}
#wavedir-banner i s{display:block;height:100%;width:0;background:#c6503c;transition:width .25s}
@keyframes wdpulse{from{opacity:.65}to{opacity:1}}
</style>
<script id="feature-wavedir">
(()=>{
'use strict';
const ID='WAVE-DIRECTOR-1.0.0';
const HOST={G:typeof G,B:typeof B,E:typeof E,waveTick:typeof waveTick,startNight:typeof startNight,planWave:typeof planWave,spawnE:typeof spawnE,endGame:typeof endGame,pickSpawns:typeof pickSpawns,
 ev:typeof ev,killQuiet:typeof killQuiet,uiUpdate:typeof uiUpdate,dirName:typeof dirName,DAYLEN:typeof DAYLEN,WARN:typeof WARN,WAVES:typeof WAVES,COUNTS:typeof COUNTS};
const missing=Object.keys(HOST).filter(k=>HOST[k]==='undefined');
if(missing.length){console.warn('['+ID+'] disabled: host globals missing: '+missing.join(', '));return}

/* ---------------------------- CONFIG (all tunable at runtime: FEATURE_WAVE_DIRECTOR.cfg.x = ...) ---------------------------- */
const CFG={
 finalWave:WAVES,                 // the wave number that ends the run when defeated. Infinity / null = endless survival
 onFinalDefeated:'victory',       // 'victory' = emit the signal, then host endGame(true).  'signal' = emit the signal only (caller decides what happens)
 prepFirst:DAYLEN,                // seconds of preparation before wave 1 (host: 55)
 prepBetween:45,                  // seconds of preparation before every later wave (counted after the recovery period)
 recovery:10,                     // breather after a cleared wave: no countdown, no warning, no spawn marker
 warnLead:WARN,                   // warning (spawn directions + toast) this many seconds before the wave (host: 22). Clamped to the preparation length
 countdownAt:[10,5,4,3,2,1],      // 'countdown' events at these remaining seconds
 spawnLead:2,                     // seconds from wave start to first spawn (host: 2)
 spawnInterval:.8,                // seconds between spawns (host: .8)
 maxSpawnSpan:24,                 // a very large wave is compressed so all of it arrives within this many seconds
 clearDelay:1,                    // all enemies of the wave must stay gone this long before 'waveCleared' (debounce)
 counts:COUNTS.slice(),           // enemies for waves 1..n (host table)
 countGrowth:4,                   // waves beyond the table: last count + growth per extra wave
 countMult:1,                     // global multiplier for the whole curve (difficulty knob)
 hpGrowth:0,                      // EXTRA hp per wave on top of the host's own 12 %/wave, e.g. .05
 baseType:'grunt',
 types:{                          // multipliers on the host enemy, applied through its existing fields (mh/hp, dmg, sm). 'grunt' = unmodified host enemy
  grunt:{hp:1,dmg:1,speed:1},
  swift:{hp:.6,dmg:.8,speed:1.35},
  brute:{hp:2.4,dmg:1.6,speed:.8}
 },
 mixFor:w=>({swift:w>=3?Math.min(.35,(w-2)*.1):0,brute:w>=4?Math.min(.3,(w-3)*.08):0}), // fraction of each non-base type in wave w
 hud:true,                        // overwrite the #wv text + floating banner
 banner:true
};
const cfg=CFG;
const $=id=>document.getElementById(id);
const isFinal=w=>cfg.finalWave!=null&&isFinite(cfg.finalWave)&&w>=cfg.finalWave;
const finalOf=()=>(cfg.finalWave!=null&&isFinite(cfg.finalWave))?cfg.finalWave:null;

/* ---------------------------- STATE ---------------------------- */
const D={enabled:true,state:'idle',held:false,next:1,prepLen:0,warned:false,fired:new Set(),lastT:0,recLen:0,
 tracked:new Set(),total:0,spawned:0,killed:0,clearT:0,totalKilled:0,finalDefeated:false,resumeWave:1,lastSpeed:null};
const LS={};
function on(evt,fn){(LS[evt]=LS[evt]||[]).push(fn);return()=>{LS[evt]=(LS[evt]||[]).filter(f=>f!==fn)}}
function emit(type,detail){const d=Object.assign({type},detail||{});
 for(const f of (LS[type]||[]).slice()){try{f(d)}catch(e){console.warn('['+ID+'] listener error',e)}}
 for(const f of (LS['*']||[]).slice()){try{f(d)}catch(e){console.warn('['+ID+'] listener error',e)}}
 try{window.dispatchEvent(new CustomEvent('wavedirector',{detail:d}));if(type==='finalWaveDefeated')window.dispatchEvent(new CustomEvent('bastion:final-wave-defeated',{detail:d}))}catch(e){}}

/* ---------------------------- WAVE TABLES ---------------------------- */
function countFor(w){const t=cfg.counts,n=t.length;let c=w<=n?t[w-1]:(n?t[n-1]:5)+cfg.countGrowth*(w-n);return Math.max(1,Math.round(c*cfg.countMult))}
function composition(w){const n=countFor(w),mix=cfg.mixFor(w)||{},out={};let left=n;
 for(const k of Object.keys(cfg.types)){if(k===cfg.baseType)continue;const q=Math.min(left,Math.round(n*Math.max(0,mix[k]||0)));if(q>0){out[k]=q;left-=q}}
 out[cfg.baseType]=left;return out}
function planList(w){const c=composition(w),items=[];for(const k in c)for(let i=0;i<c[k];i++)items.push({k,pos:(i+.5)/c[k]});
 items.sort((a,b)=>a.pos-b.pos||(a.k===cfg.baseType?-1:1));return items.map(x=>x.k)}
const prepFor=w=>Math.max(0,w<=1?cfg.prepFirst:cfg.prepBetween);

/* ---------------------------- STATE MACHINE ---------------------------- */
function enterPrep(){D.state='prep';D.next=G.wave+1;D.prepLen=prepFor(D.next);D.warned=false;D.fired=new Set();
 G.phase='day';G.t=0;G.warned=false;G.pts=[];G.sq=[];D.lastT=0;D.clearT=0;
 emit('prepStart',{wave:D.next,seconds:D.prepLen,final:isFinal(D.next)})}
function pruneTracked(){let n=0;for(const e of Array.from(D.tracked)){if(e.dead||E.indexOf(e)<0){D.tracked.delete(e);D.killed++;D.totalKilled++;n++;emit('enemyDown',{enemy:e,killed:e.hp<=0,wave:G.wave})}}return n}
function spawnOne(s){const n0=E.length;spawnE(s.p);if(E.length!==n0+1)return;const e=E[E.length-1],T=cfg.types[s.type]||cfg.types[cfg.baseType]||{hp:1,dmg:1,speed:1},w=G.wave;
 const hpm=T.hp*(1+cfg.hpGrowth*(w-1));e.mh=e.hp=e.mh*hpm;e.dmg=Math.max(1,Math.round(e.dmg*T.dmg));if(T.speed!==1)e.sm=T.speed;e.wtype=s.type;e.wnum=w;
 D.tracked.add(e);D.spawned++;emit('spawn',{enemy:e,kind:s.type,wave:w,index:D.spawned,total:D.total})}
function beginWave(){
 const pts=G.warned&&G.pts.length?G.pts:pickSpawns();
 if(!pts.length){D.prepLen=G.t+5;emit('blocked',{wave:D.next,reason:'no valid spawn point; retrying in 5 s'});return}
 startNight();                                   /* host: phase 'night', t=0, wave++, validates spawn points, horn + toast, builds its own (COUNTS) queue ... */
 const w=G.wave,list=planList(w),n=list.length,step=n>1?Math.min(cfg.spawnInterval,cfg.maxSpawnSpan/(n-1)):0;
 G.sq=list.map((k,i)=>({t:cfg.spawnLead+i*step,p:G.pts[i%G.pts.length],type:k}));   /* ... which we replace with the director's schedule (same {t,p} shape) */
 D.state='wave';D.total=n;D.spawned=0;D.killed=0;D.clearT=0;D.tracked=new Set();
 const fin=isFinal(w);if(fin)ev('toast','FINAL WAVE — '+n+' enemies approach');
 emit('waveStart',{wave:w,count:n,composition:composition(w),final:fin,points:G.pts.slice()});if(fin)emit('finalWaveStart',{wave:w,count:n})}
function waveCleared(){const w=G.wave,fin=isFinal(w);
 emit('waveCleared',{wave:w,final:fin,kills:D.killed,seconds:G.t});
 if(fin){D.finalDefeated=true;D.state='finished';emit('finalWaveDefeated',{wave:w,kills:D.totalKilled});
  if(cfg.onFinalDefeated==='victory')endGame(true);else{G.phase='day';G.pts=[];G.warned=false;G.t=0}return}
 G.phase='day';G.day++;G.pts=[];G.warned=false;G.t=0;G.sq=[];D.recLen=Math.max(0,cfg.recovery);D.state='recovery';
 ev('toast','Wave '+w+' cleared — prepare your defences');emit('recoveryStart',{wave:w,seconds:D.recLen});
 if(D.recLen<=0){emit('recoveryEnd',{wave:w});enterPrep()}}
function stepPrep(dt){G.t+=dt;const rem=D.prepLen-G.t,jumped=G.t-D.lastT>dt+1;   /* a forward jump of G.t = the host's callNight() / "Call wave" button */
 if(!D.warned&&rem<=Math.min(cfg.warnLead,D.prepLen)&&rem>0){planWave();D.warned=true;emit('warning',{wave:D.next,seconds:Math.max(0,Math.ceil(rem)),points:G.pts.slice(),final:isFinal(D.next)})}
 for(const s of cfg.countdownAt)if(rem<=s&&rem>0&&!D.fired.has(s)){D.fired.add(s);emit('countdown',{wave:D.next,seconds:s})}
 D.lastT=G.t;if(rem<=0||jumped)beginWave()}
function stepWave(dt){G.t+=dt;
 while(G.sq.length&&G.sq[0].t<=G.t)spawnOne(G.sq.shift());
 pruneTracked();
 if(!G.sq.length&&D.tracked.size===0&&D.spawned>0){D.clearT+=dt;if(D.clearT>=cfg.clearDelay)waveCleared()}else D.clearT=0}
function stepRecovery(dt){G.t+=dt;if(G.t>=D.recLen){emit('recoveryEnd',{wave:G.wave});enterPrep()}}

/* adopt a game that is already running (director enabled late / after disable()) */
function adopt(){if(G.phase==='night'){D.state='wave';D.tracked=new Set(E.filter(e=>!e.wl&&!e.dead));D.spawned=D.tracked.size;D.total=D.spawned+G.sq.length;D.killed=0;D.clearT=0}else enterPrep()}
const hasHQ=()=>B.some(b=>b.type==='hq');

const origWaveTick=waveTick;
window.waveTick=function(dt){
 if(!D.enabled)return origWaveTick(dt);
 if(!G.started){if(hasHQ()){G.started=true;G.t=0}else{G.night+=((G.phase==='night'?1:0)-G.night)*(1-Math.exp(-dt*.9));return}}
 else if(!hasHQ()){if(D.state!=='lost'){D.state='lost';emit('lost',{wave:G.wave})}endGame(false);return}
 if(D.state==='idle')adopt();
 if(!D.held){if(D.state==='prep')stepPrep(dt);else if(D.state==='wave')stepWave(dt);else if(D.state==='recovery')stepRecovery(dt)}
 G.night+=((G.phase==='night'?1:0)-G.night)*(1-Math.exp(-dt*.9))};

/* ---------------------------- PUBLIC CONTROL ---------------------------- */
function callWave(){if(D.state!=='prep'||G.state!=='play')return false;G.t=Math.max(G.t,D.prepLen);return true}   /* the next waveTick starts it (same effect as the host's callNight) */
function pause(){if(D.held)return false;D.held=true;emit('held',{state:D.state});return true}
function resume(){if(!D.held)return false;D.held=false;emit('released',{state:D.state});return true}
function cancel(o){o=o||{};if(!['prep','wave','recovery'].includes(D.state))return false;
 const mid=D.state==='wave',orphans=D.tracked.size;pruneTracked();
 if(o.killEnemies)for(const e of Array.from(D.tracked))killQuiet(e);
 const left=D.tracked.size;D.tracked=new Set();G.sq=[];G.pts=[];G.warned=false;G.phase='day';G.t=0;D.state='cancelled';D.held=false;
 D.resumeWave=mid?G.wave:G.wave+1;emit('cancelled',{wave:G.wave,midWave:mid,enemiesLeftAlive:o.killEnemies?0:left,orphans});return true}
function start(o){o=o||{};if(!G.started||G.state!=='play')return false;if(D.state==='wave'||D.state==='prep'||D.state==='recovery')return false;
 const w=o.wave||(D.state==='cancelled'?D.resumeWave:G.wave+1);G.wave=Math.max(0,w-1);D.finalDefeated=false;D.held=false;enterPrep();emit('started',{wave:w});return true}
function jumpTo(n){if(!['prep','recovery','idle','cancelled'].includes(D.state)||!G.started)return false;G.wave=Math.max(0,n-1);D.finalDefeated=false;enterPrep();return true}
function enable(){if(D.enabled)return;D.enabled=true;D.state='idle'}
function disable(){D.enabled=false}
function status(){pruneTracked();const rem=D.state==='prep'?Math.max(0,D.prepLen-G.t):D.state==='recovery'?Math.max(0,D.recLen-G.t):0;
 return{enabled:D.enabled,state:D.state,held:D.held,wave:G.wave,nextWave:D.state==='prep'?D.next:G.wave+1,finalWave:finalOf(),isFinal:isFinal(D.state==='prep'?D.next:G.wave),
  timer:G.t,remaining:rem,queued:G.sq.length,spawned:D.spawned,total:D.total,alive:D.tracked.size,killedThisWave:D.killed,totalKilled:D.totalKilled,
  finalDefeated:D.finalDefeated,gamePaused:G.speed===0,phase:G.phase}}

/* ---------------------------- HUD (presentation only) ---------------------------- */
const names=()=>{try{return[...new Set((G.pts||[]).map(dirName))].filter(Boolean).join(', ')}catch(e){return''}};
const origUi=uiUpdate;
let banner=null;
function ensureBanner(){if(banner||!document.body)return banner;banner=document.createElement('div');banner.id='wavedir-banner';document.body.appendChild(banner);return banner}
function hud(){const s=status(),fw=s.finalWave,nm=names();
 if(D.lastSpeed!==null&&D.lastSpeed!==G.speed){if(G.speed===0)emit('pause',{state:D.state});else if(D.lastSpeed===0)emit('resume',{state:D.state})}D.lastSpeed=G.speed;
 if(!cfg.hud||!D.enabled||!G.started)return;
 const wv=$('wv'),tag=D.held?' · HELD':'',of=fw?'/'+fw:'';let t='';
 if(s.state==='prep')t=`Preparation · wave ${s.nextWave}${of} in ${Math.ceil(s.remaining)}s`+(nm?` · ⚠ attack from ${nm}`:'')+(s.isFinal?' · FINAL WAVE':'');
 else if(s.state==='wave')t=`WAVE ${s.wave}${of} · ${s.alive+s.queued} enemies`+(s.queued?` (${s.queued} still to arrive)`:'')+(nm?` · from ${nm}`:'')+(s.isFinal?' · FINAL':'');
 else if(s.state==='recovery')t=`Wave ${s.wave} cleared · recovering · next preparation in ${Math.ceil(s.remaining)}s`;
 else if(s.state==='finished')t=`All ${s.wave} waves defeated`;
 else if(s.state==='cancelled')t='Attack schedule cancelled';
 if(t&&wv)wv.textContent=t+tag;
 if(G.state==='won'&&fw&&fw!==WAVES){const rp=$('rp');if(rp&&rp.textContent.indexOf('all '+WAVES+' nights')>=0)rp.textContent=rp.textContent.replace('all '+WAVES+' nights','all '+fw+' waves').replace('Nights survived: '+WAVES,'Waves survived: '+fw)}
 if(!cfg.banner)return;const b=ensureBanner();if(!b)return;let h='',cls='';
 if(G.state!=='play'){b.style.display='none';return}
 if(s.state==='prep'&&s.remaining<=10&&s.remaining>0){cls='warn'+(s.isFinal?' final':'');h=`<b>${s.isFinal?'FINAL WAVE':'WAVE '+s.nextWave} IN ${Math.ceil(s.remaining)}</b><small>${nm?'Attack from '+nm:'Brace yourselves'}</small>`}
 else if(s.state==='prep'&&D.warned){cls=s.isFinal?'final':'';h=`<b>${s.isFinal?'FINAL WAVE':'WAVE '+s.nextWave} INCOMING</b><small>${nm?'From '+nm+' · ':''}${Math.ceil(s.remaining)}s</small>`}
 else if(s.state==='wave'){cls=s.isFinal?'final':'';const done=s.total?Math.round(100*(s.total-s.alive-s.queued)/s.total):0;h=`<b>${s.isFinal?'FINAL WAVE':'WAVE '+s.wave}</b><small>${s.total-s.alive-s.queued}/${s.total} defeated · ${s.alive} alive</small><i><s style="width:${done}%"></s></i>`}
 else if(s.state==='recovery'){h=`<b>WAVE ${s.wave} REPELLED</b><small>Recover · ${Math.ceil(s.remaining)}s</small>`}
 else if(s.state==='finished'){h='<b>ALL WAVES DEFEATED</b>'}
 if(D.held&&h)h=h.replace('</b>',' · HELD</b>');
 if(h){b.className=cls;if(b._h!==h){b.innerHTML=h;b._h=h}b.style.display='block'}else b.style.display='none'}
window.uiUpdate=function(){const r=origUi.apply(this,arguments);try{hud()}catch(e){}return r};

window.FEATURE_WAVE_DIRECTOR={version:ID,cfg,on,status,callWave,pause,resume,cancel,start,jumpTo,enable,disable,countFor,composition,planList};
console.log('['+ID+'] loaded — final wave '+(finalOf()||'endless')+', counts '+[1,2,3,4,5].map(countFor).join('/'));
})();
</script>
<!-- ===== FEATURE: WAVE-DIRECTOR END (id: WAVE-DIRECTOR-1.0.0) ===== -->
