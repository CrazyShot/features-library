<!-- ===== FEATURE: VAMPIRE-ASSET-TEST START (id: VAMPIRE-ASSET-TEST-1.0.0) =====
 Purpose : show the user's vampire art (front + back view, no animation) as the visual of the EXISTING enemy, plus a small debug panel to spawn test scenarios.
 Touches : NOTHING in the original code. Wraps four globals at runtime (drawE, drawELOD, stepEnemy, pickEnemy) and tags enemy objects with e.vamp / e.vtest / e.vHold / e.vForce.
           AI / pathfinding / combat / fog / tree-depth are the unchanged game code. Fog + depth come for free because drawItems() already culls (fogVis) and sorts before it calls drawE().
 Config  : window.FEATURE_VAMPIRE_ASSET_TEST.cfg   (mode 'all'|'tagged'|'off', height, views{src,density}, hyst, pickView ...)
 Remove  : delete this whole block (or set cfg.mode='off').  Assets are inlined as data: URIs so the file stays single-file.
-->
<style id="feature-vampire-asset-test-css">
#vt-panel{right:12px;top:12px;pointer-events:auto;z-index:6;font:12px Georgia,serif;min-width:176px;line-height:1.35}
#vt-panel b{letter-spacing:.16em;color:#ff9a8a;font-size:12px}
#vt-panel .vt-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
#vt-panel button{all:unset;cursor:pointer;box-sizing:border-box;padding:3px 8px;border:1px solid var(--edge);border-radius:5px;background:rgba(40,28,18,.78);color:var(--ink);font:11.5px Georgia,serif;text-align:center}
#vt-panel button:hover{background:rgba(110,70,30,.9)}
#vt-panel .vt-row{display:flex;gap:4px;margin-top:4px}#vt-panel .vt-row button{flex:1}
#vt-panel .vt-wide{display:block;width:100%;margin-top:4px}
#vt-panel small{display:block;margin-top:5px;opacity:.7;font-size:10.5px}
#vt-panel.min .vt-body{display:none}
</style>
<script id="feature-vampire-asset-test">
(()=>{
'use strict';
const ID='VAMPIRE-ASSET-TEST-1.0.0';
const SRC_FRONT='data:image/png;base64,@@FRONT_PNG_BASE64@@';
const SRC_BACK='data:image/png;base64,@@BACK_PNG_BASE64@@';
/* ---------------- CONFIG (everything tunable lives here) ---------------- */
const CFG={
 mode:'all',            /* 'all' = every enemy is drawn as the vampire · 'tagged' = only vampires spawned by the test panel · 'off' = original enemy art */
 height:36,             /* world px of the figure (dwarf ≈ 34, original enemy ≈ 31). Same units as the rest of the sprites, scaled by the game's own zoom */
 footLift:0,            /* extra world px to raise (+) / sink (-) the sprite relative to the ground point; 0 = soles on the unit position */
 hyst:.22,              /* front/back switch dead-zone (0..1): how far from pure sideways the heading must be before the view changes */
 defaultView:'front',
 crispAbove:2,          /* screen-px per source-px at/above which nearest-neighbour is used (crisp pixel art when zoomed in) */
 flipWithFacing:false,  /* mirror the sprite with e.f (left/right). Off: the art only has front/back, so no invented side facing */
 anchorX:'feet',        /* 'feet' = centre of the lowest ~12% rows, 'bbox' = centre of the whole figure, or a number (source px from sprite left) */
 views:{                /* add side / diagonal views here later: {src, density}. density = source resolution relative to the front art (back art is drawn at half resolution) */
  front:{src:SRC_FRONT,density:1},
  back:{src:SRC_BACK,density:.5}},
 extendHitTest:true,  /* host pickEnemy() is centred 14px above the feet with a 16px radius, so the head of the taller sprite can't be right-clicked at zoom>=1. true = one extra probe `hitExtra` world px higher, only ever returning vampire-art enemies */
 hitExtra:8,
 pickView:null          /* optional override: (e,sx,sy,prevView)=>viewName, where (sx,sy) is the SCREEN-space heading (sy>0 = towards the camera) */
};
const HOST={E:typeof E,U:typeof U,B:typeof B,G:typeof G,g:typeof g,X:typeof X,Y:typeof Y,cam:typeof cam,spawnE:typeof spawnE,drawE:typeof drawE,drawELOD:typeof drawELOD,stepEnemy:typeof stepEnemy,walk:typeof walk,comp:typeof comp,cellOf:typeof cellOf,nearestWalk:typeof nearestWalk,toast:typeof toast,killQuiet:typeof killQuiet,N:typeof N,tpos:typeof tpos,fogVis:typeof fogVis,TW:typeof TW,TH:typeof TH,OX:typeof OX,OY:typeof OY,dpr:typeof dpr};
const missing=Object.keys(HOST).filter(n=>HOST[n]==='undefined');
if(missing.length){console.warn('['+ID+'] disabled: host globals missing: '+missing.join(', '));return}
/* ---------------- SPRITE LOADING (crop, anchor, mip chain; the source images are never modified) ---------------- */
const SPR={};
function mkc(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function prep(name,v){const S=SPR[name]={ok:false,density:v.density||1,mips:[]};const im=new Image();
 im.onload=()=>{try{const w=im.naturalWidth,h=im.naturalHeight,c=mkc(w,h),q=c.getContext('2d',{willReadFrequently:true});q.drawImage(im,0,0);const d=q.getImageData(0,0,w,h).data;
  let x0=w,x1=-1,y0=h,y1=-1;for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(d[(y*w+x)*4+3]>8){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  if(x1<0)throw new Error('empty image');
  const pad=1,cx=Math.max(0,x0-pad),cy=Math.max(0,y0-pad),cw=Math.min(w,x1+1+pad)-cx,ch=Math.min(h,y1+1+pad)-cy,fh=y1-y0+1;
  const t=mkc(cw,ch);t.getContext('2d').drawImage(c,cx,cy,cw,ch,0,0,cw,ch);
  /* ground anchor: bottom edge of the lowest opaque row; x = centre of the feet (or bbox) */
  let ax;const fr=Math.max(1,Math.round(fh*.12));let fx0=w,fx1=-1;for(let y=y1-fr+1;y<=y1;y++)for(let x=0;x<w;x++)if(d[(y*w+x)*4+3]>8){if(x<fx0)fx0=x;if(x>fx1)fx1=x}
  ax=CFG.anchorX==='bbox'?(x0+x1+1)/2:typeof CFG.anchorX==='number'?CFG.anchorX:(fx0+fx1+1)/2;
  S.ax=ax-cx;S.ay=(y1+1)-cy;S.w=cw;S.h=ch;S.fh=fh;S.mips=[t];
  for(let L=1;L<5;L++){const p=S.mips[L-1];if(p.width<12)break;const m=mkc(Math.ceil(p.width/2),Math.ceil(p.height/2)),mq=m.getContext('2d');mq.imageSmoothingEnabled=true;mq.imageSmoothingQuality='high';mq.drawImage(p,0,0,m.width,m.height);S.mips.push(m)}
  S.ok=true;recalc()}catch(err){console.warn('['+ID+'] sprite "'+name+'" failed: '+err.message)}};
 im.onerror=()=>console.warn('['+ID+'] sprite "'+name+'" could not be decoded');im.src=v.src}
let ppu=1;function recalc(){const a=Object.values(SPR).filter(s=>s.ok).map(s=>s.fh/s.density);if(a.length)ppu=CFG.height/(a.reduce((p,c)=>p+c,0)/a.length)}
for(const k in CFG.views)prep(k,CFG.views[k]);
/* ---------------- FRONT / BACK SELECTION ---------------- */
function viewOf(e){
 if(e.vForce&&SPR[e.vForce]&&SPR[e.vForce].ok)return e.vForce;
 let v=e.vView||CFG.defaultView,dx=0,dy=0;
 if(e.mv&&e.path&&e.path.length){dx=e.path[0][0]-e.x;dy=e.path[0][1]-e.y}                              /* walking: heading = next waypoint (the host's steer() moves straight at path[0]) */
 else{const t=e.tg;if(t&&!t.dead){const p=tpos(t);dx=p[0]-e.x;dy=p[1]-e.y}}                             /* standing / attacking: face the target */
 const sx=(dx-dy)*TW,sy=(dx+dy)*TH,m=Math.hypot(sx,sy);
 if(m>1e-6){if(CFG.pickView)v=CFG.pickView(e,sx,sy,v)||v;else{const c=sy/m;if(c>CFG.hyst)v='front';else if(c<-CFG.hyst)v='back'}}   /* screen heading: down = towards camera = front, up = away = back, near-sideways keeps the previous view */
 if(!SPR[v]||!SPR[v].ok)v=SPR[CFG.defaultView]&&SPR[CFG.defaultView].ok?CFG.defaultView:Object.keys(SPR).find(n=>SPR[n].ok)||v;
 return e.vView=v}
/* ---------------- DRAWING ---------------- */
const useVamp=e=>CFG.mode==='all'||(CFG.mode==='tagged'&&e.vamp);
const _drawE=drawE,_drawELOD=drawELOD,_stepEnemy=stepEnemy;
const stats={vamp:0,fallback:0};
function drawVamp(e){const S=SPR[viewOf(e)];if(!S||!S.ok){stats.fallback++;return _drawE(e)}stats.vamp++;
 const sx=X(e.x,e.y),sy=Y(e.x,e.y,1),k=Math.max(1,.55/cam.z),s=ppu/S.density,px=s*k*cam.z*dpr;
 g.save();g.translate(sx,sy);g.scale(k,k);
 g.fillStyle='rgba(8,6,22,.4)';g.beginPath();g.ellipse(5,1.5,11,4.2,0,0,6.3);g.fill();                      /* same ground shadow as the original enemy */
 const L=px>=1?0:Math.max(0,Math.min(S.mips.length-1,Math.floor(-Math.log2(px))));
 g.imageSmoothingEnabled=px<CFG.crispAbove;if(g.imageSmoothingEnabled)g.imageSmoothingQuality='high';
 if(CFG.flipWithFacing)g.scale(e.f,1);
 g.drawImage(S.mips[L],-S.ax*s,-S.ay*s-CFG.footLift,S.w*s,S.h*s);
 if(e.hp<e.mh){const by=-(CFG.height+6);g.fillStyle='#1a1210';g.fillRect(-12,by,24,4);g.fillStyle='#d6483a';g.fillRect(-11,by+1,22*Math.max(0,e.hp)/e.mh,2)}   /* same bar as the original enemy, placed above the head */
 g.restore()}
window.drawE=function(e){if(useVamp(e))drawVamp(e);else _drawE(e)};
window.drawELOD=function(x0,x1,y0,y1){_drawELOD(x0,x1,y0,y1);                                                   /* far-zoom batch (only reachable with "Unrestricted zoom"): draw the sprite over the blob */
 for(let i=0;i<E.length;i++){const e=E[i];if(!useVamp(e))continue;const sx=X(e.x,e.y),sy=Y(e.x,e.y,1);if(sx<x0||sx>x1||sy<y0||sy>y1||!fogVis(e.x,e.y))continue;drawVamp(e)}};
if(typeof pickEnemy==='function'){const _pick=pickEnemy;window.pickEnemy=function(sx,sy){const e=_pick(sx,sy);if(e||!CFG.extendHitTest)return e;const q=_pick(sx,sy+CFG.hitExtra*cam.z);return q&&useVamp(q)?q:null}}
window.stepEnemy=function(e,dt){if(e.vHold)return;_stepEnemy(e,dt)};                                            /* debug "stand" vampires skip their AI step; every other enemy runs the untouched original */
/* ---------------- TEST SPAWNS (use the real spawnE -> real enemy objects) ---------------- */
function spawn(x,y,o){o=o||{};const n=E.length;spawnE([x-.5,y-.5]);const e=E[E.length-1];if(E.length===n||!e)return null;
 e.x=e.sx=x;e.y=e.sy=y;e.vamp=1;e.vtest=1;if(o.hold){e.vHold=1;e.hp=e.mh=1e9;G.wE--}   /* held dummies must not keep a wave from clearing */
 if(o.force)e.vForce=o.force;
 if(o.lure)for(const b of B)e.bad.set(b,G.T+1e6);                                                                /* AI's own "avoid this target" list: makes it pick dwarves over buildings */
 return e}
function refPt(){const u=U.find(q=>!q.dead);if(u)return[u.x,u.y];const h=B.find(b=>b.type==='hq')||B[0];return h?[h.x+h.w/2,h.y+h.w/2]:[N/2,N/2]}
/* ref = a point on the walkable network the spot must connect to (the HQ's own cell is occupied, so it can't supply the component) */
function spot(cx,cy,R,ref){const rp=ref||[cx,cy],c0=comp[cellOf({x:rp[0],y:rp[1]})],a0=Math.random()*6.283;for(let rr=R;rr>1;rr*=.8)for(let i=0;i<40;i++){const a=a0+i/40*6.283,x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;if(x<2||y<2||x>N-2||y>N-2)continue;const k=(y|0)*N+(x|0);if(walk[k]&&comp[k]===c0)return[x,y]}return null}
function camTile(){const z=cam.z,u=(cam.x-OX)/TW,v=(cam.y-OY)/TH,a=Math.max(1,Math.min(N-2,(u+v)/2)),b=Math.max(1,Math.min(N-2,(v-u)/2));const q=nearestWalk(a|0,b|0);return q?[q[0]+.5,q[1]+.5]:null}
const ok=()=>{if(G.state!=='play'){toast('Vampire test: game is not running');return false}return true};
const SC={
 stand(){if(!ok())return;const p=camTile();if(p)spawn(p[0],p[1],{hold:1,force:'front'});info()},
 views(){if(!ok())return;const p=camTile();if(!p)return;const q=[p[0]+1.4,p[1]-1.4];spawn(p[0]-.7,p[1]+.7,{hold:1,force:'front'});spawn(q[0]-.7,q[1]+.7,{hold:1,force:'back'});info()},
 move(){if(!ok())return;const h=B.find(b=>b.type==='hq')||B[0],c=h?[h.x+h.w/2,h.y+h.w/2]:refPt(),p=spot(c[0],c[1],24,refPt());if(p)spawn(p[0],p[1]);info()},
 chase(){if(!ok())return;const r=refPt(),p=spot(r[0],r[1],12);if(p)spawn(p[0],p[1],{lure:1});info()},
 attack(){if(!ok())return;const r=refPt(),p=spot(r[0],r[1],1.6);if(p)spawn(p[0],p[1],{lure:1});info()},
 group(){if(!ok())return;const h=B.find(b=>b.type==='hq')||B[0],c=h?[h.x+h.w/2,h.y+h.w/2]:refPt(),p=spot(c[0],c[1],16,refPt());if(!p)return;let n=0;for(let i=0;i<14&&n<6;i++){const a=i*2.4,x=p[0]+Math.cos(a)*(.6+i*.18),y=p[1]+Math.sin(a)*(.6+i*.18),k=(y|0)*N+(x|0);if(x>1&&y>1&&x<N-1&&y<N-1&&walk[k]&&comp[k]===comp[cellOf({x:p[0],y:p[1]})]){spawn(x,y);n++}}info()},
 clear(){for(const e of E.slice())if(e.vtest){if(e.vHold)G.wE++;killQuiet(e)}info()}};
/* ---------------- DEBUG PANEL ---------------- */
const P=document.createElement('div');P.id='vt-panel';P.className='p';
P.innerHTML='<div class="vt-h"><b>VAMPIRE TEST</b><button data-a="min" title="collapse">–</button></div><div class="vt-body"><button class="vt-wide" data-a="vis"></button>'+
 '<div class="vt-row"><button data-a="stand" title="one held vampire, front view">Stand</button><button data-a="views" title="two held vampires: forced front + forced back">Front+Back</button></div>'+
 '<div class="vt-row"><button data-a="move" title="spawns far away; walks to its nearest target with the real pathfinding">Move</button><button data-a="chase" title="spawns 12 tiles from a dwarf, prefers units over buildings">Chase</button></div>'+
 '<div class="vt-row"><button data-a="attack" title="spawns just outside attack reach of a dwarf">Attack</button><button data-a="group" title="six vampires together">Group ×6</button></div>'+
 '<button class="vt-wide" data-a="clear">Clear test vampires</button><small id="vt-info"></small></div>';
document.body.appendChild(P);
const LBL={all:'Visual: vampire (all enemies)',tagged:'Visual: vampire (test spawns only)',off:'Visual: original enemy art'};
function info(){P.querySelector('[data-a=vis]').textContent=LBL[CFG.mode];const t=E.filter(e=>e.vtest).length;P.querySelector('#vt-info').textContent='test vampires: '+t+' · enemies: '+E.length}
P.addEventListener('click',ev=>{const a=ev.target.closest('button');if(!a)return;const k=a.dataset.a;a.blur();
 if(k==='min')P.classList.toggle('min');else if(k==='vis'){CFG.mode=CFG.mode==='all'?'tagged':CFG.mode==='tagged'?'off':'all';info()}else if(SC[k])SC[k]()});
P.addEventListener('pointerdown',ev=>ev.stopPropagation());
setInterval(info,500);info();
window.FEATURE_VAMPIRE_ASSET_TEST={id:ID,cfg:CFG,sprites:SPR,spawn,scenarios:SC,viewOf,drawVamp,stats,get ppu(){return ppu}};
})();
</script>
<!-- ===== FEATURE: VAMPIRE-ASSET-TEST END (id: VAMPIRE-ASSET-TEST-1.0.0) ===== -->
