/* ---------------- MapData JSON (Terrain Generator export) -> compact record ----------------

function compact(d){

  treeMask:b64(packBits(tm)),treeType:rle(Uint8Array.from(tt)),ground:rle(grid),perim:b64(packBits(per)),perimW:(d.wavePerimeter&&d.wavePerimeter.width)|0,nodes,deps}}

function crop(r,s,x0,y0){

function build(r){

  if(q.t===1||q.t===2){RT[i]=q.t;RI[i]=CFG.amountToIntensity[Math.max(0,Math.min(3,q.a))]}else if(q.t===3)gold.push(q)}

  tm:r.tm,treeType:r.tt,ground:r.ground,perim:r.perim,RI,RT,depId:DEPID,goldNodes:gold,counts:cnt,rt:0,
  /* HOOK: resF(x,y) -- continuous tile coords (tile centre = i+.5). Bilinear field over the node-tile intensities; exact at tile centres. Sets IMP.rt = resource type (1 stone / 2 iron). */
  resF(x,y){const p=x-.5,q=y-.5,i=Math.floor(p),j=Math.floor(q),u=p-i,v=q-j,at=(a,b)=>a<0||b<0||a>=w||b>=w?0:RI[b*w+a];
   const a=at(i,j),b=at(i+1,j),c=at(i,j+1),d=at(i+1,j+1);if(a+b+c+d===0){this.rt=0;return 0}
   const wa=a*(1-u)*(1-v),wb=b*u*(1-v),wc=c*(1-u)*v,wd=d*u*v;let I=wa+wb+wc+wd,best=wa,bi=j*w+i;
   if(wb>best){best=wb;bi=j*w+i+1}if(wc>best){best=wc;bi=(j+1)*w+i}if(wd>best){best=wd;bi=(j+1)*w+i+1}
   this.rt=RT[bi]||0;if(u!==0||v!==0)I*=.9+(vn(x*3.1+11,y*3.1)-.5)*.5;/* organic edge for painting; exact (noise-free) at tile centres so RES/RESI are tile-exact */

   const t=(at(i,j)*(1-u)+at(i+1,j)*u)*(1-v)+(at(i,j+1)*(1-u)+at(i+1,j+1)*u)*v,m=Math.min(1,t)*CFG.groundMix;if(m<=.002)return c;const g=CFG.groundColor;return[c[0]+(g[0]-c[0])*m,c[1]+(g[1]-c[1])*m,c[2]+(g[2]-c[2])*m]},

    for(let i=0;i<9;i++){const a=R()*6.283,d=R()*sz*.7,px=cx+Math.cos(a)*d,py=cy+Math.sin(a)*d*.55-1,z=1.3+R()*1.8;poly(c,[[px,py-z],[px+z,py],[px,py+z*.8],[px-z,py]],'#7a4a10');poly(c,[[px,py-z*.8],[px+z*.7,py],[px,py+z*.5],[px-z*.7,py]],'#ffc93c')}c.restore();sp.push(s)}

   for(let i=0;i<w*w;i++){const tm=this.tm[i];if(tm&&!TREEG[i])o.treeTilesMissing++;if(!tm&&TREEG[i])o.treeTilesExtra++;if(!!blk[i]!==!!tm)o.blkMismatch++;if(tm&&TREEG[i]!==1)o.treegNot1++;
    const t=RT[i];if(RES[i]!==t)o.resTypeMismatch++;if(t&&Math.abs(RESI[i]-RI[i])>1e-6)o.resiMismatch++;if(!t&&RES[i])o.resOnNonNode++;if(tm&&RT[i])o.treeOnResource++}

/* ---------------- source selection: URL ?map=embedded|crop192|procedural, else the staged choice (sessionStorage) ---------------- */
function select(){

 try{st=JSON.parse(sessionStorage.getItem(SKEY)||'null')}catch(e){}
 const kind=q||(st&&st.kind)||'';if(!kind||kind==='procedural')return null;
 let raw,label;
 if(kind==='embedded'){if(!EMB)throw new Error('no embedded map in this build');raw=decode(EMB);label='embedded'}
 else if(/^crop(\d+)$/.test(kind)){if(!EMB)throw new Error('no embedded map in this build');raw=crop(decode(EMB),+/^crop(\d+)$/.exec(kind)[1]);label='embedded crop'}
 else if(kind==='file'&&st&&st.data){raw=decode(st.data);if(st.crop)raw=crop(raw,st.crop);label='file '+(st.name||'')}

let IMP=null,ERR='',LABEL='';
